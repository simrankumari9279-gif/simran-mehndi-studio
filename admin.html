<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Mehndi Booking</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8eee3;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #6b3e26;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #6b3e26;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4f2d1d;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>🔐 Admin Login</h1>

        <p class="subtitle">
            Mehndi Booking Admin Panel
        </p>

        <form id="adminLoginForm">

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Admin email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Admin password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

    </div>

    <script>

        const SUPABASE_URL = "https://yhyzuaaxefcwvzmpbvol.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_bnKZTYBlYg5PAkwEk_PTTQ_H3b5ZF7g";

    

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        document
            .getElementById("adminLoginForm")
            .addEventListener("submit", async function(event) {
                alert("Login button working");

                event.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");

                message.textContent = "Login ho raha hai...";

                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                if (error) {
                    console.error(error);

                    message.textContent =
                        "❌ Email ya password galat hai.";

                    return;
                }

                message.textContent =
                    "✅ Login successful!";

                setTimeout(() => {
                    window.location.href = "admin-dashboard.html";
                }, 1000);

            });

    </script>

</body>
</html>
